[project]
name = "breeze-tts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stocko", email = "stocko2073@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "huggingface-hub>=0.34",
    "numpy>=2.0",
    "python-multipart>=0.0.18",
    "qwen-tts==0.1.1",
    "soundfile>=0.13",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "transformers==4.57.3",
    "uvicorn>=0.30",
]

[project.scripts]
breeze-tts = "breeze_tts:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]
